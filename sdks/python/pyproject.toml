[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convkit"
version = "0.1.0"
description = "Convkit Python SDK for WhatsApp bot developers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["whatsapp", "bot", "convkit", "sdk", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/somaathetechster/Convkit"
Repository = "https://github.com/somaathetechster/Convkit"

[tool.setuptools.packages.find]
where = ["."]
include = ["convkit*"]
